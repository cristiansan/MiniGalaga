<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Galaga - Juego</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--bg:#06071a;--panel:#0b1533;--accent:#39ff14;--danger:#ff4666}
    body{margin:0;background:linear-gradient(180deg,var(--bg),#000);color:#fff;font-family:Consolas,monospace,Arial;display:flex;flex-direction:column;align-items:center}
    header{padding:12px;text-align:center}
    #gameWrap{position:relative;width:900px;max-width:95vw}
    canvas{display:block;background:linear-gradient(#001022, #001018);width:100%;height:auto;border:4px solid #111;box-shadow:0 8px 30px rgba(0,0,0,.6)}
    canvas.hidden{display:none}
    #hud{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.35);padding:12px;border-radius:6px;color:var(--accent);min-width:240px}
    #hud .stat{margin-right:12px}
    #controls{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.35);padding:8px;border-radius:6px;font-size:14px}
    #overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:50;padding-bottom:20px}
    #menu{background:rgba(8,12,23,.9);padding:18px;border-radius:10px;text-align:center;min-width:260px;pointer-events:auto}
    button{background:var(--accent);color:#000;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:700}
    button.secondary{background:transparent;color:#fff;border:1px solid #555}
    small{color:#bbb}
    footer{margin:14px;color:#9aa}
  </style>
</head>
<body>
  <header>
    <h1>Mini Galaga</h1>
    <p><small>Flechas izquierda/derecha para mover, barra espaciadora para disparar</small></p>
  </header>
  <div id="gameWrap">
    <canvas id="c" width="800" height="600"></canvas>
    <div id="hud">
      <div style="display:flex;justify-content:space-between;width:100%;gap:12px">
        <div>
          <div id="score" style="font-size:28px;font-weight:bold;color:var(--accent);line-height:1">0</div>
        </div>
      </div>
    </div>
    <div id="record" style="position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:24px;font-weight:bold;color:#ff3333;line-height:1.1">— 0</div>
    <div id="fbStatus" style="position:absolute;right:12px;top:12px;width:16px;height:16px;border-radius:50%;background:#0f0;border:2px solid var(--accent)"></div>
    <div id="lives" style="position:absolute;left:12px;bottom:12px;font-size:24px">❤️ ❤️ ❤️</div>
    <div id="controls">Mover: ← → · Disparar: SPACE · Pausa: P</div>
    <div id="levelDisplay" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:64px;font-weight:bold;color:var(--accent);text-shadow:0 0 20px var(--accent);display:none;pointer-events:none;z-index:100">LEVEL 1</div>
    <div id="leaderboard" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);padding:40px;border-radius:6px;min-width:500px;text-align:center;border:3px solid var(--accent);z-index:1;display:none">
      <strong style="font-size:36px;color:var(--accent);margin-bottom:20px;display:block">TOP 10</strong>
      <ol id="topList" style="margin:20px 0 0 80px;padding:0;color:#fff;text-align:left;font-size:20px;line-height:2"></ol>
    </div>
    <div id="overlay">
      <div id="menu" role="dialog">
        <h2 id="menuTitle">Presiona INICIAR</h2>
        <p id="menuText">Una nave, dispara a las naves enemigas. Buena suerte.</p>
        <div style="margin-top:12px">
          <button id="btnStart">Iniciar</button>
          <button id="btnRestart" class="secondary" style="margin-left:8px">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>


  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getDatabase, ref, push, query, orderByChild, limitToLast, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  let fbReady = false;
  const firebaseConfig = {
    apiKey: "AIzaSyDxjczbvMPV9mm0BS7nKuZF--6Pi2jiVDI",
    authDomain: "minigalaga.firebaseapp.com",
    databaseURL: "https://minigalaga-default-rtdb.firebaseio.com",
    projectId: "minigalaga",
    storageBucket: "minagalaga.firebasestorage.app",
    messagingSenderId: "859917049119",
    appId: "1:859917049119:web:26142fc99c2d5aef61e42a"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    signInAnonymously(auth).then(()=>{
      console.log('Signed in anonymously');
      fbReady = true;
      const s = document.getElementById('fbStatus'); if(s) s.style.background = '#0f0';
    }).catch(err=>{
      console.error('Firebase auth error', err);
      const s = document.getElementById('fbStatus'); if(s) s.style.background = '#f00';
    });
  } catch(err) {
    console.error('Firebase init error', err);
    const s = document.getElementById('fbStatus'); if(s) s.style.background = '#f00';
  }

  function saveScore(name, score){
    // Save locally first
    let scores = [];
    try {
      const stored = localStorage.getItem('galaga_scores');
      if(stored) scores = JSON.parse(stored);
    } catch(e) {}
    scores.push({name: name, score: score, ts: Date.now()});
    localStorage.setItem('galaga_scores', JSON.stringify(scores));
    
    // Try Firebase only if ready
    if(!fbReady) {
      const s = document.getElementById('fbStatus'); if(s) s.textContent = 'Sin conexión (guardado local)';
      return Promise.resolve();
    }
    
    const scoresRef = ref(db, 'scores');
    return push(scoresRef, {name: name, score: score, ts: Date.now()})
      .then(r=>{ return r; })
      .catch(err=>{ console.error('Save error', err); });
  }

  function loadTop10(){
    // Load from localStorage first
    let list = [];
    try {
      const stored = localStorage.getItem('galaga_scores');
      if(stored) list = JSON.parse(stored);
    } catch(e) {}
    list.sort((a,b)=>b.score - a.score);
    list = list.slice(0, 10);
    
    const el = document.getElementById('topList');
    if(!el) return;
    el.innerHTML = '';
    list.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${item.name} — ${item.score}`;
      el.appendChild(li);
    });
    
    // Update HUD with current top score
    setTimeout(()=>{ 
      const gameFunc = window.updateGameHUD;
      if(gameFunc) gameFunc();
    }, 0);
    
    // Try to sync with Firebase only if ready
    if(!fbReady) return;
    
    try {
      const q = query(ref(db, 'scores'), orderByChild('score'), limitToLast(10));
      onValue(q, snap => {
        let fbList = [];
        snap.forEach(s => fbList.push(s.val()));
        fbList.sort((a,b)=>b.score - a.score);
        fbList = fbList.slice(0, 10);
        
        el.innerHTML = '';
        fbList.forEach(item => {
          const li = document.createElement('li');
          li.textContent = `${item.name} — ${item.score}`;
          el.appendChild(li);
        });
        
        // Update HUD with Firebase scores
        setTimeout(()=>{ 
          const gameFunc = window.updateGameHUD;
          if(gameFunc) gameFunc();
        }, 0);
      });
    } catch(e) {
      console.log('Firebase unavailable, using local scores');
    }
  }

  (function(){
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // We'll maintain logical resolution 800x600 and scale for DPR
    const LOG_W = 800, LOG_H = 600;
    
    // Audio context
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(freq, duration, type='sine'){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + duration);
    }
    
    function soundFire(){
      playSound(500, 0.12, 'sine');
    }
    
    function soundImpact(){
      playSound(400, 0.15, 'sine');
      playSound(250, 0.2, 'sine');
    }
    
    function soundExplosion(){
      for(let i=0; i<5; i++){
        setTimeout(()=>{ playSound(300 - i*50, 0.1, 'triangle'); }, i*30);
      }
    }
    
    function soundGameOver(){
      // "ti ru ru ruuu" - tipo Pac-Man
      const notes = [
        {f: 800, d: 0.1},
        {f: 600, d: 0.1},
        {f: 600, d: 0.1},
        {f: 400, d: 0.3}
      ];
      let time = 0;
      notes.forEach(n => {
        setTimeout(()=>{ playSound(n.f, n.d, 'sine'); }, time);
        time += n.d * 1000 + 50;
      });
    }

    function adjustCanvasSize(){
      const rect = canvas.getBoundingClientRect();
      const cssW = rect.width;
      const cssH = rect.height || cssW * (LOG_H/LOG_W);
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      // scale drawing operations to logical pixels
      ctx.setTransform(dpr * (canvas.width / (dpr*LOG_W)),0,0,dpr * (canvas.height / (dpr*LOG_H)),0,0);
    }

    adjustCanvasSize();
    window.addEventListener('resize', ()=>{ adjustCanvasSize(); });

    // HUD
    const elScore = document.getElementById('score');
    const elLives = document.getElementById('lives');
    const elRecord = document.getElementById('record');
    const levelDisplay = document.getElementById('levelDisplay');
    const overlay = document.getElementById('overlay');
    const menuTitle = document.getElementById('menuTitle');
    const controls = document.getElementById('controls');
    const leaderboard = document.getElementById('leaderboard');
    const isTouchDevice = navigator.maxTouchPoints && navigator.maxTouchPoints>0;
    
    // Color palettes for levels (fill, stroke)
    const colorPalettes = [
      {fill: '#ffcc33', stroke: '#ff8a33'}, // Level 1: orange/yellow
      {fill: '#ff8a33', stroke: '#ffcc33'}, // Level 2: inverted
      {fill: '#33cc33', stroke: '#66ff66'}, // Level 3: green/lime
      {fill: '#66ff66', stroke: '#33cc33'}, // Level 4: inverted
      {fill: '#3366ff', stroke: '#66ccff'}, // Level 5: blue/cyan
      {fill: '#66ccff', stroke: '#3366ff'}, // Level 6: inverted
      {fill: '#ff33cc', stroke: '#ff66ff'}, // Level 7: magenta/pink
      {fill: '#ff66ff', stroke: '#ff33cc'}, // Level 8: inverted
      {fill: '#ffaa33', stroke: '#ffdd66'}, // Level 9: orange/gold
      {fill: '#ffdd66', stroke: '#ffaa33'}  // Level 10: inverted
    ];

    // Game state
    let keys = {};
    let bullets = [];
    let enemies = [];
    let score = 0;
    let lives = 3;
    let level = 1;
    let gameOver = false;
    let running = false;
    let enemySpeed = 1.0;
    let enemyDir = 1; // 1 right, -1 left
    let enemyDrop = 20;
    let lastFire = 0;
    const fireCooldown = 200; // ms (slightly faster for touch feel)
    let levelDisplayTime = 0;
    let maxScore = 0;

    // Player (logical coords)
    const player = {w:40,h:24,x:LOG_W/2-20,y:LOG_H-60,speed:6, color:'#39ff14'};

    // Touch / pointer state
    let pointerActive = false;
    let activePointerId = null;

    function spawnEnemies(rows=3, cols=8){
      enemies = [];
      const marginX = 60;
      const spacingX = (LOG_W - marginX*2) / cols;
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          enemies.push({
            x: marginX + c*spacingX + 8,
            y: 60 + r*44,
            w:36,h:22,
            alive:true,
            offset: (r+c)%2
          });
        }
      }
    }

    // Restart current level but preserve how many enemies were already destroyed.
    // Accept deadCount param (number of enemies already destroyed BEFORE the death event)
    function restartLevelPreserveKills(deadCount){
      if(typeof deadCount !== 'number') deadCount = enemies.filter(e => !e.alive).length;
      // compute rows/cols used for this level (same logic as when spawning on level-up)
      const rows = 3 + Math.min(3, Math.floor(level/2));
      const cols = 6 + Math.min(4, Math.floor(level/2));
      // recreate the enemy grid for this level
      spawnEnemies(rows, cols);
      // mark deadCount enemies as dead so the level restarts with the same number of destroyed blocks
      for(let i=0;i<deadCount && i<enemies.length;i++){
        enemies[i].alive = false;
      }
      // reset enemy movement direction to default
      enemyDir = 1;
      // clear bullets and reset player position
      bullets = [];
      player.x = LOG_W/2 - player.w/2;
    }

    function reset(){
      bullets=[]; enemies=[]; score=0; lives=3; level=1; enemySpeed=1; enemyDir=1; gameOver=false; running=false; gameOverHandled=false; levelDisplayTime = 0;
      levelDisplay.style.display='none';
      player.x = LOG_W/2 - player.w/2;
      updateHUD();
      spawnEnemies(3,8);
      showMenu();
      loadTop10();
    }

    function updateHUD(){ 
      elScore.textContent = score;
      const hearts = lives > 0 ? '❤️ '.repeat(lives) : '💔';
      elLives.textContent = hearts;
      const topItem = document.querySelector('#topList li');
      const topScore = topItem ? parseInt(topItem.textContent.split('—')[1].trim()) : 0;
      const topName = topItem ? topItem.textContent.split('—')[0].trim() : '—';
      maxScore = Math.max(maxScore, topScore, score);
      const recordName = topScore > 0 ? topName : '—';
      elRecord.textContent = `${recordName} ${maxScore}`;
    }
    
    function getEnemyColors(){
      const idx = ((level - 1) % colorPalettes.length);
      return colorPalettes[idx];
    }

    function showMenu(msg){ 
      menuTitle.textContent = msg||'Presiona INICIAR'; 
      overlay.style.display='flex'; 
      leaderboard.style.display='block';
      canvas.classList.add('hidden');
    }
    function hideMenu(){ 
      overlay.style.display='none'; 
      leaderboard.style.display='none';
      canvas.classList.remove('hidden');
    }

    function fire(){
      const now = Date.now();
      if(now - lastFire < fireCooldown) return;
      lastFire = now;
      bullets.push({x: player.x + player.w/2 - 3, y: player.y-8, w:6,h:10, speed:10});
      soundFire();
    }

    // Controls (keyboard)
    document.addEventListener('keydown', e=>{
      if(e.code==='Space'){ e.preventDefault(); }
      if(e.code==='KeyP'){ running = !running; if(!running) showMenu('Pausado'); else hideMenu(); }
      keys[e.code]=true;
    });
    document.addEventListener('keyup', e=>{ keys[e.code]=false; });

    // Support arrow keys and A/D
    function applyInput(){
      if(keys['ArrowLeft']||keys['KeyA']){ player.x -= player.speed; }
      if(keys['ArrowRight']||keys['KeyD']){ player.x += player.speed; }
      if(keys['Space']){ fire(); }
      // clamp
      if(player.x < 6) player.x = 6;
      if(player.x + player.w > LOG_W-6) player.x = LOG_W-6 - player.w;
    }

    // Touch / Pointer handlers for mobile/touch devices
    function getLogicalPos(clientX){
      const rect = canvas.getBoundingClientRect();
      const ratio = (clientX - rect.left) / rect.width;
      return ratio * LOG_W;
    }

    function onPointerDown(x, id){
      pointerActive = true; activePointerId = id;
      const lx = getLogicalPos(x);
      player.x = lx - player.w/2;
      // hide keyboard hints on touch devices
      if(controls) controls.style.display = 'none';
      // start running if menu visible
      if(!running){ running = true; hideMenu(); }
      // immediate fire
      fire();
    }
    function onPointerMove(x, id){
      if(!pointerActive || id !== activePointerId) return;
      const lx = getLogicalPos(x);
      player.x = lx - player.w/2;
    }
    function onPointerUp(id){
      if(id !== activePointerId) return;
      pointerActive = false; activePointerId = null;
    }

    // Touch events
    canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t = e.changedTouches[0]; onPointerDown(t.clientX, t.identifier); }, {passive:false});
    canvas.addEventListener('touchmove', e=>{ e.preventDefault(); const t = e.changedTouches[0]; onPointerMove(t.clientX, t.identifier); }, {passive:false});
    canvas.addEventListener('touchend', e=>{ e.preventDefault(); const t = e.changedTouches[0]; onPointerUp(t.identifier); }, {passive:false});
    canvas.addEventListener('touchcancel', e=>{ e.preventDefault(); const t = e.changedTouches[0]; onPointerUp(t.identifier); }, {passive:false});

    // Pointer events fallback (stylus/mouse on touch devices)
    canvas.addEventListener('pointerdown', e=>{ if(e.pointerType==='touch' || e.pointerType==='pen'){ e.preventDefault(); onPointerDown(e.clientX, e.pointerId); } });
    canvas.addEventListener('pointermove', e=>{ if(e.pointerType==='touch' || e.pointerType==='pen'){ onPointerMove(e.clientX, e.pointerId); } });
    window.addEventListener('pointerup', e=>{ if(e.pointerType==='touch' || e.pointerType==='pen'){ onPointerUp(e.pointerId); } });

    // Game update
    let lastTime = 0;
    let gameOverHandled = false; // prevents duplicate Game Over prompts
    function update(dt){
      if(!running) return;
      
      // Hide level display after 1 second
      if(levelDisplayTime && Date.now() - levelDisplayTime > 1000){
        levelDisplay.style.display = 'none';
        levelDisplayTime = 0;
      }
      
      applyInput();
      let lifeLostThisFrame = false;

      // if pointer active, allow auto-fire
      if(pointerActive){ fire(); }

      // move bullets
      for(let i=bullets.length-1;i>=0;i--){
        bullets[i].y -= bullets[i].speed;
        if(bullets[i].y < -20) bullets.splice(i,1);
      }

      // move enemies as a group
      let rightmost = 0, leftmost = LOG_W;
      enemies.forEach(e=>{ if(!e.alive) return; rightmost = Math.max(rightmost, e.x+e.w); leftmost = Math.min(leftmost, e.x); });
      // change direction if touching edges
      if(rightmost > LOG_W-12) enemyDir = -1, enemies.forEach(e=>e.y += enemyDrop);
      else if(leftmost < 12) enemyDir = 1, enemies.forEach(e=>e.y += enemyDrop);

      enemies.forEach(e=>{ if(!e.alive) return; e.x += enemyDir * enemySpeed; });

      // collisions bullets vs enemies
      for(let i=bullets.length-1;i>=0;i--){
        const b = bullets[i];
        for(let j=0;j<enemies.length;j++){
          const en = enemies[j]; if(!en.alive) continue;
          if(rectIntersect(b, en)){
            soundImpact();
            en.alive = false; bullets.splice(i,1); score += 100; updateHUD(); break;
          }
        }
      }

      // compute how many were already dead BEFORE processing player collisions
      const deadBefore = enemies.filter(e => !e.alive).length;

      // enemies reach player or bottom
      for(let en of enemies){
        if(!en.alive) continue;
        if(en.y + en.h >= player.y){
          // only flag a life loss once per frame even if multiple enemies overlap
          if(!lifeLostThisFrame){
            soundExplosion();
            lives = Math.max(0, lives - 1);
            updateHUD();
            lifeLostThisFrame = true;
          }
          // mark the colliding enemy dead (but deadBefore does not include this one)
          en.alive = false;
        }
      }

      // If a life was lost this frame, handle respawn or game over
      if(lifeLostThisFrame){
        if(lives <= 0){
          // Game Over
          gameOver = true;
          running = false;
          soundGameOver();
          showMenu('Game Over');
          // On touch devices show leaderboard when game ends
          if(isTouchDevice && leaderboard) leaderboard.style.display = 'block';
          if(!gameOverHandled){
            gameOverHandled = true;
            setTimeout(()=>{
              try{
                const name = prompt('Game Over. Ingresa tu nombre para guardar el puntaje:','Anon');
                if(name){ saveScore(name, score).then(()=>{ loadTop10(); alert('Puntaje guardado.'); }).catch(err=>{ console.error(err); alert('Error guardando puntaje'); }); }
              }catch(e){ console.error(e); }
            },150);
          }
        }else{
          // Respawn level keeping count of destroyed enemies (deadBefore excludes the enemies that collided this frame)
          restartLevelPreserveKills(deadBefore);
        }
      }

      // level cleared? only check when running
      if(running && enemies.every(e=>!e.alive)){
        level++;
        if(level > 10) { level = 1; enemySpeed = 1.0; } else { enemySpeed += 0.6; }
        levelDisplayTime = Date.now();
        levelDisplay.textContent = `LEVEL ${level}`;
        levelDisplay.style.display = 'block';
        spawnEnemies(3 + Math.min(3, Math.floor(level/2)), 6 + Math.min(4, Math.floor(level/2))); 
        updateHUD();
      }
    }

    function rectIntersect(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

    // Draw
    function draw(){
      // clear to dark
      ctx.fillStyle = '#001218'; ctx.fillRect(0,0,LOG_W,LOG_H);

      // stars - simple
      for(let i=0;i<60;i++){ ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect((i*37)%LOG_W, (i*13)%LOG_H, 2,2); }

      // player
      drawPlayer();

      // bullets
      ctx.fillStyle = '#39ff14';
      bullets.forEach(b=>{ ctx.fillRect(b.x, b.y, b.w, b.h); });

      // enemies
      const colors = getEnemyColors();
      enemies.forEach((e,idx)=>{
        if(!e.alive) return;
        // simple ship shape
        ctx.fillStyle = colors.fill;
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = colors.stroke;
        ctx.fillRect(e.x+6, e.y+4, e.w-12, e.h-8);
      });

      // HUD overlay handled by DOM
    }

    function drawPlayer(){
      // triangular ship
      ctx.save();
      ctx.translate(player.x + player.w/2, player.y + player.h/2);
      ctx.fillStyle = player.color;
      ctx.beginPath(); ctx.moveTo(0,-player.h/2); ctx.lineTo(-player.w/2, player.h/2); ctx.lineTo(player.w/2, player.h/2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function loop(ts){
      const dt = ts - lastTime; lastTime = ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // Buttons
    document.getElementById('btnStart').addEventListener('click', ()=>{ 
      if(gameOver){ reset(); gameOver = false; gameOverHandled = false; } 
      running=true; 
      gameOver=false; 
      levelDisplayTime = Date.now();
      levelDisplay.textContent = `LEVEL ${level}`;
      levelDisplay.style.display = 'block';
      hideMenu(); 
    });
    document.getElementById('btnRestart').addEventListener('click', ()=>{ reset(); hideMenu(); });

    // Start
    // hide leaderboard on touch devices while playing
    if(isTouchDevice && leaderboard){ leaderboard.style.display = 'none'; }
    reset();
    requestAnimationFrame(loop);

    // Pause on blur
    window.addEventListener('blur', ()=>{ /* optional pause */ });

    // Focus handling
    canvas.addEventListener('click', ()=>{ canvas.focus(); });

    // If touch device, show touch hint
    if(isTouchDevice){ if(controls) controls.textContent = 'Toca la pantalla para mover y disparar'; }
    
    // Make updateHUD globally accessible for loadTop10
    window.updateGameHUD = updateHUD;

  })();
  </script>
</body>
</html>
